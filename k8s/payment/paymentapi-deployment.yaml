apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api

spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: payments-api
  
  template:
    metadata:
      labels:
        app: payments-api
  
    spec:
      serviceAccountName: payments-api-sa

      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      securityContext:
        fsGroup: 1654

      volumes:
      - name: payment-data
        persistentVolumeClaim:
          claimName: payment-data

      containers:
      - name: payments-api
        image: 432342421632.dkr.ecr.us-east-1.amazonaws.com/fcg-payments:1.0.0
        imagePullPolicy: IfNotPresent

        volumeMounts:
        - name: payment-data
          mountPath: /app/payment-data

        ports:
        - containerPort: 8090

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 10
          failureThreshold: 3
          initialDelaySeconds: 20

        startupProbe:
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 10
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          periodSeconds: 10
          failureThreshold: 5
          initialDelaySeconds: 3

        envFrom:
        - configMapRef:
            name: configmapcommon            
        - secretRef:
              name: secretfcg

        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8090"

        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"

        # Production uses the default AWS SDK credential chain (EKS Pod Identity/IRSA).
        # These values override the LocalStack-only settings inherited from configmapcommon.
        - name: AWS__ServiceUrl
          value: ""

        - name: AWS_ACCESS_KEY_ID
          value: ""

        - name: AWS_SECRET_ACCESS_KEY
          value: ""

        - name: NEW_RELIC_APP_NAME
          value: "FCG-PaymentsAPI"

        - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
          value: "true"

        - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
          value: "true"

        - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
          value: "true"
