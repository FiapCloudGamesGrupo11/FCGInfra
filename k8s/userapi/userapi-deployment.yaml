apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-user

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fcg-user

  template:
    metadata:
      labels:
        app: fcg-user

    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      containers:
        - name: fcg-user
          image: 432342421632.dkr.ecr.us-east-1.amazonaws.com/fcg-user:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8070

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          envFrom:
            - configMapRef:
                name: configmapcommon
            - secretRef:
                name: secretfcg

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8070"

            - name: NEW_RELIC_APP_NAME
              value: "FCG-UsersAPI"

            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"

            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"

            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
