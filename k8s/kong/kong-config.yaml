apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config

data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
      - name: user-api
        url: http://user-api:8070
        routes:
          - name: user-public-routes
            paths:
              - ~/api/User/(CreateUser|Login)$
            methods:
              - POST
            regex_priority: 100
            strip_path: false

          - name: user-swagger-route
            hosts:
              - user.localhost
            paths:
              - /swagger
            strip_path: false

          - name: user-protected-routes
            paths:
              - /api/User
            strip_path: false

      - name: catalog-api
        url: http://catalog-api:8080
        routes:
          - name: catalog-swagger-route
            hosts:
              - catalog.localhost
            paths:
              - /swagger
            strip_path: false

          - name: catalog-protected-routes
            paths:
              - /api/Game
              - /api/OnSale
              - /api/UsersGames
              - /search
            strip_path: false
