apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      nodeSelector:
        eks.amazonaws.com/compute-type: auto

      containers:
      - name: kong
        image: kong:3.9
        imagePullPolicy: IfNotPresent

        ports:
        - name: proxy
          containerPort: 8000
        - name: admin
          containerPort: 8001

        startupProbe:
          httpGet:
            path: /status
            port: admin
          periodSeconds: 5
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /status
            port: admin
          periodSeconds: 10
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /status
            port: admin
          periodSeconds: 20
          failureThreshold: 3

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        env:
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "2"
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr

        volumeMounts:
        - name: kong-declarative
          mountPath: /kong/declarative
          readOnly: true

      volumes:
      - name: kong-declarative
        configMap:
          name: kong-declarative-config
          items:
          - key: kong.yml
            path: kong.yml
