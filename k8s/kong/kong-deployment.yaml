apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kong

  template:
    metadata:
      labels:
        app: kong

    spec:
      containers:
      - name: kong
        image: kong:3.9
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8000
        - containerPort: 8001

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        env:
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "2"
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: /kong/declarative/kong.yml
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_ADMIN_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_ADMIN_ERROR_LOG
          value: /dev/stderr

        volumeMounts:
        - name: kong-declarative
          mountPath: /kong/declarative
          readOnly: true

      volumes:
      - name: kong-declarative
        configMap:
          name: kong-declarative-config
          items:
          - key: kong.yml
            path: kong.yml
