apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb

  selector:
    app: kong

  ports:
  - name: proxy
    port: 80
    targetPort: 8000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin

spec:
  type: ClusterIP

  selector:
    app: kong

  ports:
  - name: admin
    port: 8001
    targetPort: 8001
    protocol: TCP
