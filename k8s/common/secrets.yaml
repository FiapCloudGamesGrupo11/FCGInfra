apiVersion: v1
kind: Secret
metadata:
  name: secretfcg
type: Opaque
stringData:
  # SQL Server
  ConnectionStrings__ConnectionString: "Server=db,1433;Initial Catalog=FiapCloudGames;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;"
  SA_PASSWORD: "Your_strong!Passw0rd"

  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "Your_strong!MongoPassw0rd"
  MongoSettings__ConnectionString: "mongodb://admin:Your_strong!MongoPassw0rd@mongo:27017/FiapCloudGames?authSource=admin"
  MongoSettings__DatabaseName: "FiapCloudGames"

  # RabbitMQ
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Port: "5672"
  RabbitMQ__Username: "guest"
  RabbitMQ__Password: "guest"
