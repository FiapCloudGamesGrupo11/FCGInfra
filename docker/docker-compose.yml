name: fcg

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Your_strong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: fcg-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "Your_strong!MongoPassw0rd"
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fcg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalogapi:
    build:
      context: ../../FCGCatalog
      dockerfile: Dockerfile
    image: fiapcloudgames:latest
    container_name: catalogapi
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectionString: "Server=db,1433;Initial Catalog=FiapCloudGames;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;"
      MongoSettings__ConnectionString: "mongodb://admin:Your_strong!MongoPassw0rd@mongo:27017/FiapCloudGames?authSource=admin"
      MongoSettings__DatabaseName: "FiapCloudGames"
      RabbitMq__Host: rabbitmq
      RabbitMq__User: guest
      RabbitMq__Password: guest
      RabbitMq__OrderQueueName: order-placed
      RabbitMq__PaymentProcessQueueName: payment-processed
      Redis__ConnectionString: "redis:6379"
      Redis__InstanceName: "FiapCloudGames:"

  userapi:
    build:
      context: ../../FCGUser
      dockerfile: Dockerfile
    image: userapi:latest
    container_name: userapi
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    expose:
      - "8070"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8070
      ConnectionStrings__ConnectionString: "Server=db,1433;Initial Catalog=FiapCloudGames;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;"
      AWS__Region: us-east-1
      AWS__ServiceUrl: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CatalogApi__BaseUrl: http://catalogapi

  paymentsapi:
    build:
      context: ../../FCGPayment
      dockerfile: Dockerfile
    image: paymentsapi:latest
    container_name: apipayments
    depends_on:
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    expose:
      - "8090"
      - "8091"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      AWS__Region: us-east-1
      AWS__ServiceUrl: http://localstack:4566
      AWS__PaymentNotificationQueue: notification-payment-processed
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  localstack:
    build:
      context: ../..
      dockerfile: FCGInfra/docker/localstack/Dockerfile
    image: fcg-localstack:4.8.1
    container_name: fcg-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,lambda,iam,logs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: "0"
      LAMBDA_DOCKER_NETWORK: fcg-network
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_ACCOUNT_ID: ${NEW_RELIC_ACCOUNT_ID:-}
      NEW_RELIC_TRUSTED_ACCOUNT_KEY: ${NEW_RELIC_TRUSTED_ACCOUNT_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kong:
    image: kong:3.9
    container_name: kong-gateway
    depends_on:
      - userapi
      - catalogapi
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default:
    name: fcg-network

volumes:
  mongo-data:
